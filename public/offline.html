<!DOCTYPE html>
<!-- Desarrollado por Marco Antonio Posligua San Martín -->
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sin conexión — Proyecto Conecta</title>
  <style>
    body {
      margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center;
      background: #f8fafc; color: #0f172a; text-align: center; padding: 24px;
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    }
    .caja { max-width: 320px; }
    h1 { font-size: 1.3rem; margin: 0 0 10px; color: #003366; }
    p { font-size: .92rem; line-height: 1.6; color: #475569; }
    button {
      margin-top: 18px; padding: 10px 22px; border: none; border-radius: 10px;
      background: #003366; color: #fff; font-weight: 600; font-size: .92rem; cursor: pointer;
    }
  </style>
</head>
<body>
  <div class="caja">
    <h1>Sin conexión</h1>
    <p>No pudimos comunicarnos con el servidor. Revisa tu conexión a internet e inténtalo de nuevo.</p>
    <button onclick="location.reload()">Reintentar</button>
  </div>
</body>
</html>
